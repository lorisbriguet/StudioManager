# Weekly dependency PRs, Saturday morning, so the Mac mini's Sunday maintenance
# run (studio-tools scripts/maint) finds them. Patch and minor updates come
# grouped in one PR per ecosystem; major updates come one PR each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Majors that can't land as a plain bump, so their PRs stay red:
    # - FullCalendar 7 merges the plugins into core and renames the CSS
    #   classes; it comes with the calendar restyle, as its own task.
    # - TypeScript 7 isn't supported by typescript-eslint yet. Remove this
    #   rule once it is.
    ignore:
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: cargo
    directories: ["/src-tauri", "/src-tauri/mcp"]
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
