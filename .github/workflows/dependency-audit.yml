name: Dependency audit

on:
  schedule:
    # Mondays 06:00 UTC — failures email the repo owner
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # release.yml runs it on the tag before building: no release ships on a red audit.
  workflow_call:
  push:
    branches: [main]
    paths:
      - package-lock.json
      - src-tauri/Cargo.lock
      - src-tauri/mcp/Cargo.lock
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri
      - run: cargo audit
        working-directory: src-tauri/mcp

  # Weekly only (not on release or push): tests run in a random order, so a
  # test that passes only after another one shows up. The seed is printed;
  # re-run locally with `npx vitest run --sequence.shuffle --sequence.seed=<seed>`.
  vitest-shuffled:
    name: vitest (shuffled order)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Same install as ci.yml: the lockfile needs npm 11, and no install scripts run.
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: |
          seed=$(date +%s)
          echo "shuffle seed: $seed"
          npx vitest run --sequence.shuffle --sequence.seed="$seed"
