name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, lint, test
    # macOS because that is the only platform the app ships to, so the
    # tests run where the product runs. (Runner choice is not what fixes the
    # golden PDF snapshots: those depend on the Node build's ICU data, and
    # the test canonicalises the Swiss thousands separator itself.)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # This repo's lockfile requires npm 11: npm 10.9 (bundled with Node 22
      # on GitHub-hosted runners) crashes with "Cannot read properties of
      # null (reading 'edgesOut')" resolving Vitest 4's peer set — see
      # RELEASING.md, prerequisites. Upgrade before `npm ci`.
      # No dependency needs an install script, so none run.
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run

  rust:
    name: app crate clippy, test
    # Lints and tests the app's Rust code on every push. No bundle: a full
    # Tauri build takes over ten minutes, too long for every push. Releases
    # are built either on Loris's Mac or by the Release build workflow
    # (release.yml, started by hand on a tag), both per RELEASING.md. The MCP
    # crate is checked there; Rust dependencies by the weekly `cargo audit`
    # job in dependency-audit.yml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: 1.93.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # npm 10.9 (bundled with Node 22) crashes on Vitest 4's peer set (RELEASING.md, prerequisites).
      # No dependency needs an install script, so none run.
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts

      # The app crate only compiles with the MCP sidecar binary (Tauri's
      # externalBin) and the built frontend (frontendDist, ../dist) in place.
      # The MCP build goes inside src-tauri/target so rust-cache keeps it.
      - run: bash scripts/build-mcp.sh
        env:
          MCP_CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/mcp
      - run: npx vite build
      # From src-tauri, so cargo reads src-tauri/.cargo/config.toml (the
      # SQLite flag). CARGO_TARGET_DIR overrides its Mac-only target-dir and
      # keeps the build where rust-cache looks. --locked: build from
      # Cargo.lock as committed, fail if it would need to change.
      - name: cargo clippy and test
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
