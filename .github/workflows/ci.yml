name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck, lint, test
    # macOS because that is the only platform the app ships to, so the
    # tests run where the product runs. (Runner choice is not what fixes the
    # golden PDF snapshots: those depend on the Node build's ICU data, and
    # the test canonicalises the Swiss thousands separator itself.)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # This repo's lockfile requires npm 11: npm 10.9 (bundled with Node 22
      # on GitHub-hosted runners) crashes with "Cannot read properties of
      # null (reading 'edgesOut')" resolving Vitest 4's peer set — see
      # RELEASING.md, prerequisites. Upgrade before `npm ci`.
      # No dependency needs an install script, so none run.
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run

      # No Rust build here on purpose: a full Tauri build takes over ten
      # minutes, too long for every push. Releases are built either on Loris's
      # Mac or by the Release build workflow (release.yml, started by hand on
      # a tag), both per RELEASING.md. Rust dependencies are still covered
      # separately by the weekly `cargo audit` job in dependency-audit.yml.
