name: Release build

# Builds, signs and drafts a release for a tag that already exists (RELEASING.md
# steps 1, 2, 4 and 6). Started by hand only, on the tag:
#   gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z
# (or Actions › Release build › Run workflow, "Use workflow from" the tag).
# Never runs on pushes or pull requests, so code from a fork can't reach the
# signing key.
#
# First the dependency audit (dependency-audit.yml) runs on the tag: a red audit
# stops the release before anything is built.
#
# Two jobs, so the updater key never meets the build:
# - build: gates, then `tauri build` with no key. Every npm package, build.rs
#   and proc-macro runs here, on a runner that never holds a secret.
# - sign: a fresh runner in the "release" environment (waits for Loris's
#   approval, v* tags only). It installs one pinned tool, the Tauri signer,
#   and only the signing step sees the key and its password. Then it checks
#   that installed apps will accept the signature, writes latest.json and
#   drafts the release.
# Actions are pinned by commit; the comment gives the version. Dependabot opens
# a weekly grouped PR to bump the pins (.github/dependabot.yml). If the key is
# lost or leaks, see RELEASING.md, "Updater key: rotation, loss, leak".
#
# Stays by hand (RELEASING.md): version bump, changelog, tag (before); smoke test
# of the .dmg, menu bar checks, publishing the draft, /mcp reconnect (after).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 3.4.1 (the tag v<version> must exist)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  # The signer the sign job installs. Must match @tauri-apps/cli in
  # package-lock.json (the build job checks).
  TAURI_CLI_VERSION: 2.12.4

jobs:
  audit:
    uses: ./.github/workflows/dependency-audit.yml

  build:
    name: build v${{ inputs.version }}
    needs: audit
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
    steps:
      # Start it on the tag (gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z):
      # the release environment only accepts v* tags.
      - name: Check the version input and the ref
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] || { echo "start it on the tag v$VERSION (got $GITHUB_REF)"; exit 1; }

      # Fails fast on a re-run for a release that is already out. This token can't
      # see drafts, so an existing draft passes; the sign job checks again at upload.
      - name: Check v${{ inputs.version }} is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "v$VERSION is already published: the workflow never replaces its assets (RELEASING.md)"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
          components: clippy

      # npm 10.9 (bundled with Node 22) crashes on Vitest 4's peer set (RELEASING.md, prerequisites).
      # No dependency needs an install script, so none run.
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts

      - name: Versions match the tag and the signer
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          cli=$(node -p "require('./package-lock.json').packages['node_modules/@tauri-apps/cli'].version")
          echo "package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo, tag $VERSION; Tauri CLI $cli, signer $TAURI_CLI_VERSION"
          [ "$pkg" = "$VERSION" ] && [ "$conf" = "$VERSION" ] && [ "$cargo" = "$VERSION" ]
          [ "$cli" = "$TAURI_CLI_VERSION" ] || { echo "update TAURI_CLI_VERSION in release.yml to $cli"; exit 1; }

      # RELEASING.md step 1 (EN/FR parity is part of vitest: src/__tests__/i18nParity.test.ts)
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run lint
      - run: bash scripts/build-mcp.sh
      - name: MCP server tests and clippy
        working-directory: src-tauri/mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target-mcp
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
      # The app crate needs the built frontend (frontendDist) to compile.
      # From src-tauri, so cargo reads its .cargo/config.toml (job CARGO_TARGET_DIR wins).
      - run: npx vite build
      - name: App tests and clippy
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      # RELEASING.md step 2: every count must be 0
      - name: Design-system grep gates
        run: |
          a=$(grep -rnE 'bg-gray-|text-gray-|border-gray-|divide-gray-' src --include='*.tsx' | wc -l)
          b=$(grep -rn 'dark:' src --include='*.tsx' | grep -v '// ' | grep -vE 'dark: boolean|darkMode' | wc -l)
          c=$(grep -rnE '>[✕←→✓▸↑↓]<' src --include='*.tsx' | wc -l)
          echo "gray classes $a, dark: variants $b, text glyph icons $c"
          [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ]

      # RELEASING.md step 4, without the key: the sign job signs the update.
      - name: Build (unsigned update)
        run: bash scripts/build-unsigned.sh

      - name: Check the bundle
        run: |
          b="$CARGO_TARGET_DIR/release/bundle"
          ls -l "$b/dmg" "$b/macos"
          test -s "$b/macos/StudioManager.app.tar.gz"
          test -s "$b/dmg/StudioManager_${VERSION}_aarch64.dmg"
          dir=$("$b/macos/StudioManager.app/Contents/MacOS/studiomanager-mcp" --print-data-dir)
          echo "MCP data dir: $dir"
          case "$dir" in *ch.studiomanager.app) ;; *) exit 1;; esac
          mkdir -p "$RUNNER_TEMP/out"
          cp "$b/macos/StudioManager.app.tar.gz" "$b/dmg/StudioManager_${VERSION}_aarch64.dmg" "$RUNNER_TEMP/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  sign:
    name: sign and draft v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle

      # Only scripts/verify-update-signature.mjs is needed from the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          sparse-checkout: scripts/verify-update-signature.mjs
          sparse-checkout-cone-mode: false

      # One exact version from npm (published versions can't change), no install scripts.
      - name: Install the Tauri signer
        run: |
          npm install --prefix "$RUNNER_TEMP/signer" --no-save --no-audit --no-fund --ignore-scripts "@tauri-apps/cli@$TAURI_CLI_VERSION"
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" --version

      # The only step that sees the key. Without the password the signer fails.
      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY is not set in the release environment"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set in the release environment"; exit 1; }
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign --app-version "$VERSION" bundle/StudioManager.app.tar.gz
          test -s bundle/StudioManager.app.tar.gz.sig

      # Installed apps accept an update only if it is signed with the key whose
      # pubkey they shipped with: the one in the latest published release, which
      # differs from this tag's during a key rotation (RELEASING.md).
      - name: Check installed apps accept the signature
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prev=$(gh release view --json tagName --jq .tagName)
          gh api "repos/$GH_REPO/contents/src-tauri/tauri.conf.json?ref=$prev" --jq .content | base64 -d \
            | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).plugins.updater.pubkey)' > installed.pub
          echo "checking against the pubkey of $prev"
          out=$(node repo/scripts/verify-update-signature.mjs bundle/StudioManager.app.tar.gz bundle/StudioManager.app.tar.gz.sig @installed.pub)
          echo "$out"
          case "$out" in *"version:$VERSION)") ;; *) echo "the signature is not bound to $VERSION"; exit 1;; esac

      # RELEASING.md step 6
      - name: Write latest.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const sig = fs.readFileSync(process.argv[1], "utf8").trim();
            const url = `https://github.com/lorisbriguet/StudioManager/releases/download/v${v}/StudioManager.app.tar.gz`;
            const p = { signature: sig, url };
            const out = { version: v, notes: `StudioManager v${v}`, pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
                          platforms: { "darwin-aarch64": p } };
            fs.writeFileSync("latest.json", JSON.stringify(out, null, 2) + "\n");
          ' bundle/StudioManager.app.tar.gz.sig
          cat latest.json

      # RELEASING.md step 7, as a draft: Loris publishes it after the smoke test
      - name: Draft release with the three assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=("bundle/StudioManager_${VERSION}_aarch64.dmg" bundle/StudioManager.app.tar.gz latest.json)
          # A version with a suffix (3.4.1-rc.1) is a prerelease: never "latest", so the updater skips it.
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          # Only a draft gets its assets replaced: a published release keeps what users downloaded.
          draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = "false" ]; then
            echo "v$VERSION is already published: assets not replaced (RELEASING.md)"; exit 1
          elif [ "$draft" = "true" ]; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$VERSION" --draft "${pre[@]}" --verify-tag --title "StudioManager v$VERSION" \
              --notes "Built by the Release build workflow. Replace with the changelog before publishing." "${assets[@]}"
          fi
          echo "Draft ready: smoke-test the .dmg, then publish (RELEASING.md steps 4 and 8)."
