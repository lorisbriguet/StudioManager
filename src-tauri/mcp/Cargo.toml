[package]
name = "studiomanager-mcp"
version = "0.1.0"
description = "StudioManager agent access (MCP server)"
edition = "2021"
rust-version = "1.88" # rmcp 3.8 requires it
publish = false

# Standalone package (not part of the app crate): keep it its own workspace root.
[workspace]

[lib]
name = "studiomanager_mcp"
path = "src/lib.rs"

[[bin]]
name = "studiomanager-mcp"
path = "src/main.rs"

[dependencies]
# Same pin as the app crate (see src-tauri/Cargo.toml).
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
# flock(2) for the change log (std's File::lock needs Rust 1.89). Already in
# the tree through tokio, mio and getrandom.
libc = "0.2"
