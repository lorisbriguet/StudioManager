  "allow-capture-add",
  "allow-capture-projects",
  "allow-agents-conversation",
  "allow-agents-term-open",
  "allow-agents-term-write",
  "allow-agents-term-resize",
  "allow-agents-term-close",
  "allow-agents-send",
  "allow-agents-prompt",
  "allow-agents-answer",
  "allow-agents-list",
  "allow-agents-watch",
  "allow-agents-login-status",
  "allow-agents-login-check",
  "allow-agents-save-image",
  "allow-routines-get",
  "allow-routines-save",
  "allow-routines-run",
  "allow-routines-runs",
  "allow-routines-open-result",
  "allow-routines-open-link",
  "allow-routines-open-folder",
  "allow-menubar-open-main",
