[[set]]
identifier = "menubar-window"
description = "The menu bar panel: list agents and answer their prompts, the Claude sign-in, plan usage, the day's routines, noting a capture, and opening the main window. No database, files, settings, terminals or routine editing."
permissions = [
  "allow-agents-list",
  "allow-agents-watch",
  "allow-agents-prompt",
  "allow-agents-answer",
  "allow-agents-login-status",
  "allow-agents-login-check",
  "allow-agents-usage-limits",
  "allow-agents-usage-activity",
  "allow-routines-get",
  "allow-routines-runs",
  "allow-routines-run",
  "allow-routines-open-result",
  "allow-routines-open-folder",
  "allow-routines-open-link",
  "allow-capture-add",
  "allow-capture-projects",
  "allow-menubar-open-main",
  "allow-menubar-hide",
]

[[set]]
identifier = "capture-window"
description = "The capture panel (Control-Option-Space): save a thought, pick a project, close the panel. No database, files, settings, agents or terminals."
permissions = [
  "allow-capture-add",
  "allow-capture-projects",
  "allow-capture-hide",
]
