# Which app commands each window may call. Every command is declared in build.rs; a command
# no set below allows is refused for every window. Keep the menu bar set to what the panel
# uses (src/menubar): a test in lib.rs checks both sets against the handler.

[[set]]
identifier = "main-window"
description = "The main window: every app command."
permissions = [
  "allow-execute-batch",
  "allow-prepare-equipment-org",
  "allow-enter-test-mode",
  "allow-exit-test-mode",
  "allow-enter-presentation-mode",
  "allow-exit-presentation-mode",
  "allow-snapshot-db",
  "allow-create-backups",
  "allow-restore-snapshot",
  "allow-has-snapshot",
  "allow-get-active-db",
  "allow-get-init-error",
  "allow-retry-init",
  "allow-list-organisations",
  "allow-create-organisation",
  "allow-rename-organisation",
  "allow-reorder-organisations",
  "allow-delete-organisation",
  "allow-switch-organisation",
  "allow-set-organisation-prefs",
  "allow-share-pdf-via-mail",
  "allow-open-in-finder",
  "allow-list-project-docs",
  "allow-read-project-doc",
  "allow-extract-pdf-text",
  "allow-ocr-image-text",
  "allow-calendar-list-writable",
  "allow-calendar-create-event",
  "allow-calendar-delete-event",
  "allow-get-agent-access",
  "allow-set-agent-access",
  "allow-preview-claude-desktop",
  "allow-install-claude-desktop",
  "allow-recent-agent-changes",
  "allow-connection-save-secret",
  "allow-connection-delete-secret",
  "allow-network-check",
  "allow-open-remote-link",
  "allow-time-machine-status",
  "allow-tailscale-status",
  "allow-connection-test",
  "allow-connection-sync",
  "allow-paperless-inbox",
  "allow-paperless-download",
  "allow-paperless-thumbnail",
  "allow-paperless-mark-linked",
  "allow-agents-get-enabled",
  "allow-agents-get-settings",
  "allow-agents-set-enabled",
  "allow-agents-set-menu-bar",
  "allow-agents-set-limit-alerts",
  "allow-agents-set-briefing",
  "allow-agents-set-reminders",
  "allow-agents-briefing-folder",
  "allow-briefing-status",
  "allow-agents-status-line-preview",
  "allow-agents-status-line-install",
  "allow-agents-status-line-remove",
  "allow-agents-usage-limits",
  "allow-agents-usage-activity",
  "allow-agents-start-folders",
